name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - backend: default
            flags: --no-default-features
          - backend: cpython-set
            flags: --features cpython-set
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets ${{ matrix.flags }} -- -D warnings
      - run: cargo test --locked ${{ matrix.flags }}

  cpython-order:
    name: CPython 3.12 order comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.11'
      - name: Compare iteration and difference against CPython
        env:
          BRZ_COLLECTIONS_BACKEND: cpython
          BRZ_TEST_CPYTHON: python
        run: cargo test --locked --test cpython_oracle -- --ignored
