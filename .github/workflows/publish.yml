name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.11'
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --features cpython-set
      - name: Compare iteration and difference against CPython
        env:
          BRZ_COLLECTIONS_BACKEND: cpython
          BRZ_TEST_CPYTHON: python
        run: cargo test --locked --test cpython_oracle -- --ignored
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Configure CARGO_REGISTRY_TOKEN for this repository before publishing."
            exit 1
          fi
          cargo publish --locked --registry crates-io
